name: Setup APT mirrors
description: Configure Ubuntu package downloads with automatic mirror failover.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        # Hardened workers have a read-only root and no sudo. Their native
        # dependencies belong in the isolated image, not in a privileged job.
        if { [[ "$(id -u)" == 0 ]] && [[ ! -w /etc/apt ]]; } || { [[ "$(id -u)" != 0 ]] && ! sudo -n true 2>/dev/null; }; then
          echo "APT configuration skipped; use native dependencies baked into the isolated runner image."
          exit 0
        fi
        . /etc/os-release
        [[ "$ID" == ubuntu ]] || { echo "Ubuntu is required for APT setup." >&2; exit 1; }
        privileged() {
          if [[ "$(id -u)" == 0 ]]; then "$@"; else sudo "$@"; fi
        }
        mirror_file=/etc/apt/unn-ubuntu-mirrors.txt
        case "$(dpkg --print-architecture)" in
          amd64)
            printf '%s\tpriority:%s\n' \
              https://archive.ubuntu.com/ubuntu 1 \
              https://mirrors.edge.kernel.org/ubuntu 2 \
              https://mirror.math.princeton.edu/pub/ubuntu 3 \
              | privileged tee "$mirror_file" > /dev/null
            ;;
          arm64)
            printf '%s\tpriority:%s\n' https://ports.ubuntu.com/ubuntu-ports 1 \
              | privileged tee "$mirror_file" > /dev/null
            ;;
          *) echo "Unsupported Ubuntu runner architecture." >&2; exit 1 ;;
        esac

        # APT's mirror transport retries each file against the next server.
        privileged find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' \) \
          -exec sed -i -E \
          "s#https?://(([^/]+\\.)?archive|security)\\.ubuntu\\.com/ubuntu/?#mirror+file:$mirror_file#g; s#https?://ports\\.ubuntu\\.com/ubuntu-ports/?#mirror+file:$mirror_file#g" {} +

        # Move on to a fallback before an unreachable server exhausts the job.
        printf '%s\n' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' \
          | privileged tee /etc/apt/apt.conf.d/80-mirror-timeouts > /dev/null
