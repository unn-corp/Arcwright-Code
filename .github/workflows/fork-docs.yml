name: Fork documentation
on:
  pull_request:
    paths:
      [
        "AGENTS.md",
        "fork-upstream.json",
        "docs/**",
        "apps/**",
        "packages/**",
        "scripts/**",
        ".github/workflows/fork-docs.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "AGENTS.md",
        "fork-upstream.json",
        "docs/**",
        "apps/**",
        "packages/**",
        "scripts/**",
        ".github/workflows/fork-docs.yml",
      ]
permissions:
  contents: read
jobs:
  documentation:
    strategy:
      matrix:
        os: [linux, windows]
    runs-on: [self-hosted, "${{ matrix.os }}", x64, unn, unn-isolated, t3-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: node scripts/check-fork-docs.ts
        shell: bash
      - name: Check upstream database ownership and published migration identities
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pin = JSON.parse(readFileSync('fork-upstream.json', 'utf8'));
          if (!/^[a-f0-9]{40}$/.test(pin.upstreamCommit)) throw new Error('Invalid upstream commit');
          if (!/^[\w.-]+\/[\w.-]+$/.test(pin.upstreamRepository)) throw new Error('Invalid upstream repository');
          execFileSync('git', ['fetch', '--quiet', '--no-tags', '--depth=1', `https://github.com/${pin.upstreamRepository}.git`, pin.upstreamCommit], { stdio: 'inherit' });
          NODE
          node scripts/check-upstream-database.ts
      - name: Parse Windows installer without executing it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
